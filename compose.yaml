services:
  ace:
    image: epicsnail7712/ace:latest
    build: .
    container_name: ace

    ports:
      - "8001:8000"

    env_file:
      - .env

    depends_on:
      searxng:
        condition: service_healthy

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: ace-searxng
    restart: unless-stopped

    # Expose the local instance for diagnostics without making it available to
    # other computers on the LAN. Ace reaches it over the Compose network.
    ports:
      - "127.0.0.1:8080:8080"

    entrypoint:
      - /bin/sh
      - -c
      - |
        secret=$$(head -c 32 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 32)
        sed "s/__SEARXNG_SECRET__/$${secret}/g" /tmp/settings.template.yml > /etc/searxng/settings.yml
        exec /usr/local/searxng/entrypoint.sh

    volumes:
      - ./searxng/settings.template.yml:/tmp/settings.template.yml:ro

    healthcheck:
      test:
        - CMD
        - /usr/local/searxng/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/search?q=health&format=json', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s
