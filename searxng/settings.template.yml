use_default_settings: true

search:
  # Ace consumes structured search results. HTML remains enabled so the local
  # diagnostics page at http://127.0.0.1:8080 is still usable in a browser.
  formats:
    - html
    - json

server:
  secret_key: "__SEARXNG_SECRET__"
  limiter: false
  image_proxy: true
